[project]
name = "napoles-agents"
version = "0.1.0"
description = "N.A.P.L.E.S. – agenti AI per la resilienza urbana di Napoli"
authors = [
    { name = "Leonardo Monaco", email = "64544645+lnrdmnc@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.7",
    "pydantic>=2.14.3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
